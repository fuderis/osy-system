[package]
name = "osy-system"
description = "A local system management agent. Provides system metrics, appearance changing, power & media control, disks & infrastructure management."
version = "0.10.0"
edition = "2024"

[dependencies]
osy-share.workspace = true
osy-skill.workspace = true

atoman.workspace = true
macron.workspace = true
rigging.workspace = true
pearce.workspace = true
anylm.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
rand.workspace = true

system-utils = { version = "0.2.0", features = ["full"] }
libc = "0.2.191"
music-index = "0.2.0"
russh = "0.63.3"
russh-keys = "0.49.2"
base64 = "0.23.1"
