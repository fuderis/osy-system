[package]
name = "osy-system"
description = "Local system management agent — provides system metrics, appearance changing, power & media control, disks & infrastructure management."
version = "0.7.1"
edition = "2024"

[dependencies]
osy-share.path = "../osy-kernel/crates/share"
osy-skill.path = "../osy-kernel/crates/skill"

atoman = { version = "0.11.6", features = ["full"] }
macron = { version = "0.5.1", features = ["full"] }
rigging = { version = "0.5.2", features = ["full"] }
pearce = { version = "0.5.2", features = ["full"] }
anylm = { version = "0.3.4", features = ["full"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.42", features = ["serde"] }
regex = "1.12.2"
system-utils = { version = "0.1.6", features = ["full"] }
rand = "0.10.1"
music-index = "0.2.0"
russh = "0.63.3"
russh-keys = "0.49.2"
base64 = "0.23.1"
